[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1_000_000
remappings = ["forge-std/=lib/forge-std/src/"]

# Every contract here is expiry-driven, and a validator's few seconds of leeway is immaterial
# against day-scale reference lifetimes. Silenced globally rather than annotated ten times.
[lint]
exclude_lints = ["block-timestamp"]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "attributes_first"
quote_style = "double"
number_underscore = "preserve"
sort_imports = true

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
base = "${BASE_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
mainnet = {key = "${ETHERSCAN_API_KEY}"}
base = {key = "${ETHERSCAN_API_KEY}", chain = 8453}
sepolia = {key = "${ETHERSCAN_API_KEY}"}
